<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UCSL Education</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      background: #f6f8fa;
      color: #24292f;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 70px 24px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 42px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      margin: 0 0 12px;
      font-size: 20px;
      color: #57606a;
    }

    .description {
      margin: 0 auto 40px;
      max-width: 650px;
      line-height: 1.8;
      color: #57606a;
      font-size: 16px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-block;
      padding: 15px 24px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      transition: transform 0.15s ease,
                  box-shadow 0.15s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    }

    .github {
      background: #24292f;
      color: #ffffff;
    }

    .repository {
      background: #0969da;
      color: #ffffff;
    }

    .card {
      margin-top: 55px;
      padding: 28px;
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 14px;
      text-align: left;
    }

    .card h2 {
      margin-top: 0;
      font-size: 22px;
    }

    .card p {
      margin-bottom: 0;
      line-height: 1.8;
      color: #57606a;
    }

    footer {
      margin-top: 60px;
      font-size: 13px;
      color: #8c959f;
    }

    @media (max-width: 600px) {
      .container {
        padding: 45px 18px;
      }

      h1 {
        font-size: 32px;
      }

      .subtitle {
        font-size: 18px;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>UCSL Education</h1>

    <p class="subtitle">
      Uchida Computer Science Laboratory
    </p>

    <p class="description">
      教育・授業・プログラミング教材などを公開するための
      GitHub Education ポータルです。
    </p>

    <div class="buttons">

      <a
        class="button github"
        href="https://github.com/ucsl-edu"
        target="_blank"
        rel="noopener noreferrer">
        🐙 GitHub Organizationを見る
      </a>

      <a
        class="button repository"
        href="https://github.com/ucsl-edu/ucsl-edu.github.io"
        target="_blank"
        rel="noopener noreferrer">
        📁 このサイトのリポジトリ
      </a>

    </div>

    <section class="card">
      <h2>🎓 UCSL Education</h2>

      <p>
        大学授業や演習で使用する教材、サンプルプログラム、
        学習用プロジェクトなどを順次公開していきます。
      </p>
    </section>

    <footer>
      © UCSL Education
    </footer>

  </main>

</body>
</html>
